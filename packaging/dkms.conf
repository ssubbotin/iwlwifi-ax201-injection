PACKAGE_NAME="iwlwifi-ax201-inject"
PACKAGE_VERSION="0.1"

# Build all four iwlwifi modules from one source tree so their modversions
# CRCs stay internally consistent (iwlwifi exports symbols consumed by the
# opmode modules). Only iwlwifi + iwlmvm are used by the AX201, but shipping
# the matching iwlmld/iwldvm avoids a CRC mismatch against the stock ones.
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

BUILT_MODULE_NAME[0]="iwlwifi"
DEST_MODULE_LOCATION[0]="/updates"

BUILT_MODULE_NAME[1]="iwlmvm"
BUILT_MODULE_LOCATION[1]="mvm"
DEST_MODULE_LOCATION[1]="/updates"

BUILT_MODULE_NAME[2]="iwlmld"
BUILT_MODULE_LOCATION[2]="mld"
DEST_MODULE_LOCATION[2]="/updates"

BUILT_MODULE_NAME[3]="iwldvm"
BUILT_MODULE_LOCATION[3]="dvm"
DEST_MODULE_LOCATION[3]="/updates"

AUTOINSTALL="yes"
